name: native_video_editor_example
description: Demonstrates native_video_editor.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  file_picker: ^10.3.7
  flutter:
    sdk: flutter
  native_video_editor:
    path: ../
  path_provider: ^2.1.5
  video_player: ^2.9.2
  # The official video_player package has no Windows implementation.
  # This federated backend lets the existing VideoPlayerController API work.
  video_player_win: ^3.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
