name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Dry-run Pub Publish
        run: flutter pub publish --dry-run

  native_desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            device: windows
          - os: macos-latest
            device: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Test native composition exports
        run: flutter test integration_test/composition_integration_test.dart -d ${{ matrix.device }}
        working-directory: example
      - name: Compile iOS backend
        if: runner.os == 'macOS'
        run: flutter build ios --simulator --debug
        working-directory: example

  native_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example
      - name: Run Android request validation tests
        run: bash gradlew :native_video_editor:testDebugUnitTest --console=plain
        working-directory: example/android
